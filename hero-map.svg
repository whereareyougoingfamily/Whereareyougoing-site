<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized world map with a winding road and a marker on Ohio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Simplified continent silhouettes, brand-muted -->
  <g fill="#22303F" fill-opacity="0.07">
    <!-- North America -->
    <path d="M120,180 C180,140 260,150 320,190 C370,220 380,270 350,310 C400,330 420,380 390,420 C360,460 300,470 260,450 C220,480 170,470 150,430 C110,420 90,370 110,330 C80,300 90,240 120,180 Z"/>
    <!-- South America -->
    <path d="M330,460 C370,450 410,480 420,530 C430,590 410,650 380,690 C360,720 320,710 310,670 C290,620 300,560 310,510 C300,490 310,470 330,460 Z"/>
    <!-- Europe -->
    <path d="M680,160 C720,140 770,150 800,180 C820,200 810,230 780,240 C790,270 770,300 740,300 C710,300 690,280 690,250 C660,250 650,220 660,200 C650,185 660,170 680,160 Z"/>
    <!-- Africa -->
    <path d="M700,320 C760,310 820,340 840,400 C860,460 850,540 810,600 C790,640 750,650 730,610 C700,600 680,560 690,510 C660,480 660,430 680,390 C670,360 680,335 700,320 Z"/>
    <!-- Asia -->
    <path d="M850,150 C950,120 1080,140 1150,190 C1220,230 1240,300 1190,340 C1220,370 1210,420 1160,430 C1100,460 1020,440 970,400 C920,410 870,380 860,330 C820,320 800,280 820,240 C800,210 810,175 850,150 Z"/>
    <!-- Australia -->
    <path d="M1080,560 C1130,545 1190,560 1210,600 C1225,635 1200,670 1160,675 C1120,685 1080,665 1070,625 C1050,610 1055,580 1080,560 Z"/>
  </g>

  <!-- Winding road across the map, matching brand road motif -->
  <path d="M60,700 C220,620 300,500 260,400 C220,300 380,260 480,320 C600,390 700,300 780,220 C880,120 1050,140 1180,220 C1260,270 1320,240 1360,180"
        fill="none" stroke="#DE9A3C" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.55"/>
  <path d="M60,700 C220,620 300,500 260,400 C220,300 380,260 480,320 C600,390 700,300 780,220 C880,120 1050,140 1180,220 C1260,270 1320,240 1360,180"
        fill="none" stroke="#A8452B" stroke-width="1.5" opacity="0.35"/>

  <!-- Ohio marker -->
  <g transform="translate(300,330)">
    <circle r="9" fill="#A8452B" opacity="0.85"/>
    <circle r="16" fill="none" stroke="#A8452B" stroke-width="2" opacity="0.4"/>
    <text x="18" y="5" font-family="Inter, sans-serif" font-size="20" fill="#22303F" opacity="0.55" font-weight="600">Columbus, OH</text>
  </g>

  <!-- Compass rose, echoing the brand mark -->
  <g transform="translate(1180,650)" opacity="0.4">
    <circle r="46" fill="none" stroke="#22303F" stroke-width="2"/>
    <path d="M0,-40 L8,0 L0,40 L-8,0 Z" fill="#DE9A3C"/>
    <path d="M-40,0 L0,8 L40,0 L0,-8 Z" fill="#22303F"/>
  </g>
</svg>
